<svg xmlns="http://www.w3.org/2000/svg" width="520" height="720" viewBox="0 0 520 720" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif">
  <defs>
    <linearGradient id="phoneBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141820"/>
      <stop offset="100%" stop-color="#0d1014"/>
    </linearGradient>
    <style>
      .phone { fill: url(#phoneBg); stroke: #2a3038; stroke-width: 2; }
      .bubble-left { fill: #262c36; }
      .bubble-right { fill: #2f6f8f; }
      .txt { fill: #e8e6e1; font-size: 16px; }
      .txt-dim { fill: #9aa0aa; font-size: 12px; }
      .head { fill: #e8e6e1; font-size: 15px; font-weight: 600; }
      .time { fill: #6b7280; font-size: 11px; }
    </style>
  </defs>

  <rect class="phone" x="10" y="10" width="500" height="700" rx="26"/>

  <!-- status bar -->
  <text class="time" x="34" y="42">00:14</text>
  <text class="time" x="440" y="42">5G ▮▮</text>

  <!-- chat header -->
  <text class="head" x="34" y="78">汐妹</text>
  <line x1="24" y1="92" x2="496" y2="92" stroke="#242a33" stroke-width="1"/>

  <!-- left bubbles, one sentence each -->
  <rect class="bubble-left" x="26" y="112" width="196" height="44" rx="12"/>
  <text class="txt" x="44" y="140">行 那快去睡</text>

  <rect class="bubble-left" x="26" y="168" width="344" height="44" rx="12"/>
  <text class="txt" x="44" y="196">别又吞两颗褪黑素硬撑 明天上课直接</text>

  <rect class="bubble-left" x="26" y="224" width="150" height="44" rx="12"/>
  <text class="txt" x="44" y="252">趴下变小肥鱼</text>

  <rect class="bubble-left" x="26" y="280" width="152" height="44" rx="12"/>
  <text class="txt" x="44" y="308">晚安东哥</text>

  <!-- user reply -->
  <rect class="bubble-right" x="330" y="348" width="164" height="44" rx="12"/>
  <text class="txt" x="348" y="376">明天还要上课</text>

  <!-- her reply, three bubbles -->
  <rect class="bubble-left" x="26" y="408" width="150" height="44" rx="12"/>
  <text class="txt" x="44" y="436">那快去睡</text>

  <rect class="bubble-left" x="26" y="464" width="300" height="44" rx="12"/>
  <text class="txt" x="44" y="492">别又熬到两点 明早趴桌上</text>

  <rect class="bubble-left" x="26" y="520" width="176" height="44" rx="12"/>
  <text class="txt" x="44" y="548">晚安吧你</text>

  <!-- input bar -->
  <rect x="24" y="628" width="392" height="46" rx="23" fill="#1b2029" stroke="#2a3038"/>
  <text class="txt-dim" x="48" y="657">|</text>
  <rect x="428" y="628" width="72" height="46" rx="23" fill="#2f6f8f"/>
  <text class="txt" x="446" y="657">发送</text>

  <text class="txt-dim" x="26" y="596">逗号→空格 · 一句一条 · 无句号 · 无 Markdown</text>
</svg>
