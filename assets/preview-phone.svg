<svg xmlns="http://www.w3.org/2000/svg" width="520" height="760" viewBox="0 0 520 760" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif">
  <defs>
    <linearGradient id="phoneBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141820"/>
      <stop offset="100%" stop-color="#0d1014"/>
    </linearGradient>
    <style>
      .phone { fill: url(#phoneBg); stroke: #2a3038; stroke-width: 2; }
      .bubble-left { fill: #262c36; }
      .bubble-right { fill: #2f6f8f; }
      .txt { fill: #e8e6e1; font-size: 16px; }
      .txt-dim { fill: #9aa0aa; font-size: 12px; }
      .head { fill: #e8e6e1; font-size: 15px; font-weight: 600; }
      .time { fill: #6b7280; font-size: 11px; }
    </style>
  </defs>

  <rect class="phone" x="10" y="10" width="500" height="740" rx="26"/>

  <text class="time" x="34" y="42">00:14</text>
  <text class="time" x="440" y="42">5G</text>

  <text class="head" x="34" y="78">汐妹</text>
  <line x1="24" y1="92" x2="496" y2="92" stroke="#242a33" stroke-width="1"/>

  <!-- 三条气泡：一句一条 -->
  <rect class="bubble-left" x="26" y="112" width="196" height="44" rx="12"/>
  <text class="txt" x="44" y="140">行 那快去睡</text>

  <!-- 整句一个气泡，两行文字 -->
  <rect class="bubble-left" x="26" y="168" width="352" height="72" rx="12"/>
  <text class="txt" x="44" y="196">别又吞两颗褪黑素硬撑 明天上课</text>
  <text class="txt" x="44" y="224">直接趴下变小肥鱼</text>

  <rect class="bubble-left" x="26" y="252" width="152" height="44" rx="12"/>
  <text class="txt" x="44" y="280">晚安东哥</text>

  <!-- 对方回复 -->
  <rect class="bubble-right" x="330" y="316" width="164" height="44" rx="12"/>
  <text class="txt" x="348" y="344">明天还要上课</text>

  <!-- 她的回复，带情绪标点 -->
  <rect class="bubble-left" x="26" y="376" width="196" height="44" rx="12"/>
  <text class="txt" x="44" y="404">那快去睡？</text>

  <rect class="bubble-left" x="26" y="432" width="330" height="44" rx="12"/>
  <text class="txt" x="44" y="460">别又熬到两点 明早趴桌上！</text>

  <rect class="bubble-left" x="26" y="488" width="176" height="44" rx="12"/>
  <text class="txt" x="44" y="516">晚安吧你…</text>

  <rect x="24" y="668" width="392" height="46" rx="23" fill="#1b2029" stroke="#2a3038"/>
  <text class="txt-dim" x="48" y="697">|</text>
  <rect x="428" y="668" width="72" height="46" rx="23" fill="#2f6f8f"/>
  <text class="txt" x="446" y="697">发送</text>

  <text class="txt-dim" x="26" y="572">逗号→空格 · 一句一条 · 无句号</text>
  <text class="txt-dim" x="26" y="594">但 ？！… 要敢用 —— 那是情绪</text>
  <text class="txt-dim" x="26" y="616">整句就是一个气泡，只是换行，不拆两条</text>
</svg>
